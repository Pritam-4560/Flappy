spritekiln: 1
name: voidship
kind: character
view: side
mirror: false
directions: [w]
size: 96
palette: gothic
camera: {scale: 0.16, center: [0, 0.2, 0], pitch: 0}
shadow: null

brief:
  summary: The Void Cruiser, final boss. A dark alien warship facing left - long armoured hull, glowing crimson cockpit with a single red eye, dorsal and ventral fins, side engine pods, a belly cannon whose muzzle charges with magenta light, flame exhaust at the back.
  must_keep: [long dark hull, crimson cockpit dome, red eye, belly cannon, glowing muzzle, exhaust flame, fins]

ramps:
  hull:  ["#100e1a", "#2a2640", "#4a4468", "#7470a0", "#b0acd8"]
  plate: ["#0c0a14", "#221e34", "#3a3456", "#5c5680", "#8c86b4"]
  accent: ["#3a0008", "#b00a20", "#ff2a40", "#ff9aa0"]
  metal: ["#0e0d14", "#2a2a36", "#4c4c5e", "#7c7c92", "#b4b4c8"]
  glass: ["#1a0710", "#4a0f24", "#8c1a3c", "#d42a5a", "#ff6a8e"]
  eye:   ["#3a0000", "#a00010", "#ff1030", "#ff9a9a"]
  lamp:  ["#3a1a00", "#c06000", "#ffb020", "#fff0a0"]
  flame: ["#3a0a00", "#c03010", "#ff7a20", "#ffe080"]
  core:  ["#2a0030", "#8a0aa0", "#e040ff", "#ffd0ff"]

materials:
  hull:  {ramp: hull, finish: metal, gamma: 0.62}
  accent: {ramp: accent, emissive: true, band: 2}
  plate: {ramp: plate, finish: metal, gamma: 0.8}
  metal: {ramp: metal, finish: metal}
  glass: {ramp: glass, emissive: true, band: 3, outline: true}
  eye:   {ramp: eye, emissive: true, band: 2}
  lamp:  {ramp: lamp, emissive: true, band: 2}
  flame: {ramp: flame, emissive: true, band: 2}
  core:  {ramp: core, emissive: true, band: 2}

channels:
  bob: 0
  tilt: 0
  thrust: 0.5
  charge: 0
  recoil: 0

bones:
  ship:   {parent: root, pos: "[0, bob, -recoil*0.25]", rot: "[tilt, 0, 0]"}
  cannon: {parent: ship, pos: "[0, 0, -recoil*0.35]"}

parts:
  hull:
    material: hull
    space: ship
    blend: 0.25
    prims:
      - ellipsoid: {c: [0, 0, 0], r: [1.5, 1.15, 3.9]}
      - cone: {a: [0, 0, 2.6], b: [0, -0.15, 4.5], r: [0.95, 0.22]}
  belly:
    material: plate
    space: ship
    prims:
      - ellipsoid: {c: [0, -0.78, -0.4], r: [1.3, 0.62, 3.0]}
  stripe:
    material: accent
    space: ship
    min_cover: 1
    prims:
      - box: {c: [0, 0.12, -0.4], half: [1.54, 0.07, 2.9], round: 0.03}
  dome:
    material: glass
    space: ship
    prims:
      - ellipsoid: {c: [0, 0.95, 0.7], r: [0.85, 0.62, 1.3]}
  eye:
    material: eye
    space: ship
    priority: 2
    prims:
      - sphere: {c: [0, 0.82, 2.25], r: 0.42}
  fin_top:
    material: plate
    space: ship
    prims:
      - extrude: {c: [0, 0, 0], rot: [0, 1.5708, 0], depth: 0.3, round: 0.04, profile: {polygon: [[3.7, 0.6], [2.0, 0.9], [2.9, 2.5], [4.0, 2.4]]}}
  fin_bot:
    material: plate
    space: ship
    prims:
      - extrude: {c: [0, 0, 0], rot: [0, 1.5708, 0], depth: 0.3, round: 0.04, profile: {polygon: [[3.2, -0.7], [1.9, -1.0], [2.7, -2.1], [3.6, -2.0]]}}
  pod_L:
    material: metal
    space: ship
    prims:
      - ellipsoid: {c: [1.55, -0.25, -1.2], r: [0.45, 0.45, 1.7]}
  pod_glow_L:
    material: lamp
    space: ship
    prims:
      - sphere: {c: [1.55, -0.25, 0.45], r: 0.2}
  lights_L:
    material: lamp
    space: ship
    min_cover: 1
    prims:
      - sphere: {c: [1.38, 0.5, -2.2], r: 0.13}
      - sphere: {c: [1.45, 0.5, -1.2], r: 0.13}
      - sphere: {c: [1.45, 0.5, -0.2], r: 0.13}
      - sphere: {c: [1.4, 0.5, 0.8], r: 0.13}
  engine:
    material: metal
    space: ship
    prims:
      - cylinder: {a: [0, 0.15, -3.5], b: [0, 0.15, -4.4], r: 0.62, round: 0.05}
  flame:
    material: flame
    space: ship
    prims:
      - ellipsoid: {c: "[0, 0.15, -4.7 - 0.3*thrust]", r: "[0.42, 0.42, 0.45 + 0.4*thrust]"}
  gun:
    material: metal
    space: cannon
    prims:
      - cylinder: {a: [0, -0.95, 2.0], b: [0, -0.95, 4.7], r: 0.28, round: 0.04}
      - box: {c: [0, -0.95, 3.2], half: [0.36, 0.36, 0.4], round: 0.05}
  muzzle:
    material: core
    space: cannon
    priority: 2
    min_cover: 1
    prims:
      - sphere: {c: "[0, -0.95, 4.85 + 0.2*charge]", r: "0.14 + 0.42*charge"}

animations:
  idle:
    frames: 8
    ms: 90
    channels:
      bob: "0.12*sin(p)"
      tilt: "0.025*sin(p + 1.0)"
      thrust: "0.55 + 0.45*sin(p*2)"
  charge:
    frames: 8
    ms: 90
    channels:
      bob: "0.05*sin(p)"
      tilt: "-0.02"
      thrust: "0.3 + 0.2*sin(p*3)"
      charge: "t"
  fire:
    frames: 4
    ms: 70
    channels:
      charge: "max(0, 1 - t*1.6)"
      recoil: "max(0, 1 - t*1.4)"
      tilt: "0.07*max(0, 1 - t*1.4)"
      thrust: "1"
  hit:
    frames: 4
    ms: 70
    channels:
      tilt: "0.14*sin(p)"
      bob: "0.12*sin(p*2)"
      thrust: "0.2"
