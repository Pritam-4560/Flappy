<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flapocalypse</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:400/640;background:#141b2e;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="400" height="640"></canvas>
<script>
"use strict";
// ============================ FLAPOCALYPSE ============================
// Classic one-tap Flappy Bird, side-scrolling, but the level is one long map with a finish line.
// Every death banks scrap. Permanent upgrades let you get further until you can finish it in ONE run.
const W = 400, H = 640, PPM = 20, SUMMIT = 3000, BX = 110;   // 20 px = 1 m, bird sits at x = 110
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- Map ----------
const ZONES = [
  { n: 'The Junkyard',    to: 500,  sky: ['#262b44', '#68386c', '#b55088', '#f6757a', '#feae34'], bar: '#3a4466', hi: '#8b9bb4', lo: '#181425', sil: '#3e2731' },
  { n: 'The Smog Works',  to: 1200, sky: ['#181425', '#193c3e', '#265c42', '#3e8948', '#a8c84a'], bar: '#733e39', hi: '#e4a672', lo: '#3e2731', sil: '#181425' },
  { n: 'Rust Pipes',      to: 1900, sky: ['#181425', '#733e39', '#a22633', '#e43b44', '#f77622'], bar: '#3a4466', hi: '#c0cbdc', lo: '#181425', sil: '#181425' },
  { n: 'The Storm Spire', to: 2500, sky: ['#181425', '#262b44', '#124e89', '#0099db', '#2ce8f5'], bar: '#5a6988', hi: '#c0cbdc', lo: '#262b44', sil: '#181425' },
  { n: 'The Summit',      to: 3000, sky: ['#181425', '#181425', '#262b44', '#3a4466', '#68386c'], bar: '#d77643', hi: '#fee761', lo: '#733e39', sil: '#181425' },
];
const ZGAP = [190, 176, 162, 150, 138], ZSPD = [150, 165, 185, 205, 225], ZSP = [250, 240, 230, 220, 210];
const GUARDS = [
  { alt: 500,  name: 'Junk Hawk',        hits: 3, reward: 50,  pat: [[0], [4], [2], [0, 4], [1], [3]] },
  { alt: 1200, name: 'The Great Pigeon', hits: 5, reward: 100, pat: [[0], [4], [2], [1, 3], [0, 2], [2, 4], [1, 3]] },
  { alt: 3000, name: 'Storm Engine',     hits: 7, reward: 200, pat: [[1, 3], [0, 2, 4], [2], [0, 1], [3, 4], [0, 4], [1, 2, 3]] },
];
const zoneOf = m => { if (!FX().zones) return 0; const i = ZONES.findIndex(z => m < z.to); return i < 0 ? ZONES.length - 1 : i; };

// ---------- Versions: every update changes how the game looks ----------
const ADD = [{}, { junk: 1, scrap: 1, workshop: 1 }, { drones: 1, pads: 1, cards: 1, fever: 1 }, { zones: 1 }, { guardians: 1 }, { sprite: 1, music: 1, pixel: 1 }];
const VERS = [
  { v: '1.0', name: 'Classic', sum: 'The original one-tap game.', visual: 'Sunny sky, green pipes, yellow bird',
    notes: ['Tap to flap through the pipes', 'Score is pipes passed', 'No upgrades, no extras: pure Flappy'] },
  { v: '1.1', name: 'The Junkyard', sum: 'A junkyard world and a reason to return.', visual: 'Tin-can bird, girder pipes, dark sky',
    notes: ['Rivet, a tin-can sparrow, is the new bird', 'Girder pipes with hazard-stripe caps', 'Collect scrap, bank it when you die', 'Workshop: permanent upgrades each run', 'Distance in metres and a best line'] },
  { v: '1.2', name: 'Drones & Launchers', sum: 'New things to hit, grab and ride.', visual: 'Drones, launchers, bubbles, pink glow',
    notes: ['Stomp junk drones by landing on them', 'Launchers rocket you past the pipes', 'Card bubbles: pick 1 of 3 upgrades', 'Fever: near-misses charge a x2 scrap mode'] },
  { v: '1.3', name: 'Five Zones', sum: 'The map changes as you fly further.', visual: 'Sky and weather shift by zone',
    notes: ['Smog Works, Rust Pipes, Storm Spire', 'Moving pipes, gears, wind and lightning', 'Every zone has its own sky and weather', 'Pipes get tighter and faster deeper in'] },
  { v: '1.4', name: 'Guardians', sum: 'A finish line, and bosses guarding it.', visual: 'Red beam lanes, bosses, progress bar',
    notes: ['Three guardian boss fights, 3,000 m map', 'Fly into the blue cores to hurt them', 'Finish the map in one run to win', 'Shortcut Cannons and a progress bar'] },
  { v: '1.5', name: 'Pixel Rivet', sum: 'The pixel-art update.', visual: 'Everything redrawn in pixels',
    notes: ['Pixel-art Rivet made with SpriteKiln', 'Whole game on a 100x160 pixel grid', 'Limited colour palette, pixel font', 'Synth music that speeds up in Fever'] },
].map((o, i) => ({ ...o, f: Object.assign({}, ...ADD.slice(0, i + 1)) }));
const LATEST = VERS.length;
let ver = LATEST;
try { const sv = +localStorage.getItem('fl.ver'); if (sv >= 1 && sv <= LATEST) ver = sv; } catch (e) {}
const FX = () => VERS[ver - 1].f;

// ---------- Save (each version keeps its own progress; the latest keeps the original key) ----------
const saveKey = () => 'flapocalypse.v3' + (ver === LATEST ? '' : '.ver' + ver);
let save;
function loadSave() {
  save = { scrap: 0, best: 0, runs: 0, summits: 0, tier: { hull: 0, wing: 0, salv: 0 }, beaten: {}, cannon: {}, startAlt: 0, daily: null };
  try {
    const s = JSON.parse(localStorage.getItem(saveKey()) || '{}');
    Object.assign(save, s); save.tier = Object.assign({ hull: 0, wing: 0, salv: 0 }, s.tier);
    save.beaten = s.beaten || {}; save.cannon = s.cannon || {};
  } catch (e) {}
}
loadSave();
const persist = () => { try { localStorage.setItem(saveKey(), JSON.stringify(save)); } catch (e) {} };
function selectVer(v) { ver = v; try { localStorage.setItem('fl.ver', String(v)); } catch (e) {} loadSave(); dailyMode = false; newRun(); }

// ---------- Workshop (permanent upgrades) ----------
const TIER_COST = [60, 300, 1000, 2500];
const BRANCHES = [
  { id: 'hull', name: 'Hull',    tiers: ['Start with 1 shield', 'Start with 2 shields', 'Tighter frame: smaller hitbox, gravity -5%', 'Phoenix Core: revive once per run'] },
  { id: 'wing', name: 'Wings',   tiers: ['Pipe gaps +10 px', 'Flap power +6%', 'World moves 6% slower', 'Gaps +10 px more, Fever lasts 4 s longer'] },
  { id: 'salv', name: 'Salvage', tiers: ['+20% scrap', 'Distance bonus: 6 scrap per 10 m', 'Card bubbles offer 4 cards', '+50% scrap'] },
];
const CANNONS = [{ g: 0, alt: 500, cost: 300 }, { g: 1, alt: 1200, cost: 900 }];

// ---------- Cards (found in bubbles during a run) ----------
const CARDS = [
  { id: 'feather', name: 'Featherweight', desc: 'Gravity -10%',                 stack: 3 },
  { id: 'flap',    name: 'Strong Flap',   desc: 'Flap power +6%',               stack: 3 },
  { id: 'slow',    name: 'Slow Time',     desc: 'World speed -8%',              stack: 3 },
  { id: 'shield',  name: 'Bubble',        desc: '+1 shield (max 2 from cards)', stack: 2 },
  { id: 'magnet',  name: 'Scrap Magnet',  desc: 'Pull scrap from farther away', stack: 3 },
  { id: 'surge',   name: 'Scrap Surge',   desc: '+40% scrap this run',          stack: 3 },
  { id: 'soft',    name: 'Soft Landing',  desc: 'Fall speed -25%',              stack: 2 },
  { id: 'engine',  name: 'Chaos Engine',  desc: 'Fever fills 40% faster',       stack: 2 },
  { id: 'spring',  name: 'Stomp Spring',  desc: 'Stomp bounce +25%',            stack: 2 },
  { id: 'wide',    name: 'Wide Berth',    desc: 'Pipe gaps +12 px',             stack: 3 },
];

// ---------- RNG: gameplay is seeded so the Daily Run is the same map for everyone ----------
let dailyMode = false, seedRand = Math.random, pickRand = Math.random;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const grng = (a, b) => a + seedRand() * (b - a);
const rng = (a, b) => a + Math.random() * (b - a);
const todayStr = () => new Date().toISOString().slice(0, 10);
const dayNumber = () => Math.floor(Date.parse(todayStr()) / 864e5) - 20000;
const hashStr = t => { let h = 2166136261; for (const ch of t) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };

// ---------- State ----------
let state = 'title';            // title | updates | menu | play | pick | dead | victory
let run, buttons = [], cards = [], parts = [], floaters = [];
let last = 0, shake = 0, deadAt = 0, copied = 0, zoneToast = { t: 0, txt: '' }, flash = { c: '#fff', a: 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tl = id => (!FX().workshop || dailyMode && state !== 'menu' && state !== 'dead' && state !== 'victory') ? 0 : (save.tier[id] || 0);
const cl = id => (run && run.cards[id]) || 0;

// ---------- Audio (synthesised, no files) ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('fl.mute') === '1'; } catch (e) {}
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'square', vol = 0.06, delay = 0) {
  if (muted) return; const a = AC; if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.08) {
  if (muted) return; const a = AC; if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(), g = a.createGain(); src.buffer = buf; g.gain.value = vol; src.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  flap:  () => tone(360 + Math.random() * 50, 170, 0.09, 'square', 0.04),
  scrap: () => { tone(900, 1350, 0.07, 'triangle', 0.07); tone(1350, 1800, 0.07, 'triangle', 0.05, 0.05); },
  stomp: () => { tone(320, 70, 0.16, 'square', 0.09); noise(0.1, 0.07); },
  launch: () => { tone(110, 900, 0.55, 'sawtooth', 0.07); noise(0.45, 0.06); },
  shield: () => { tone(620, 280, 0.22, 'triangle', 0.09); },
  fever: () => [0, 1, 2, 3].forEach(i => tone(440 * Math.pow(1.26, i), 440 * Math.pow(1.26, i), 0.12, 'square', 0.06, i * 0.07)),
  hit:   () => { tone(700, 1500, 0.14, 'triangle', 0.09); noise(0.06, 0.05); },
  die:   () => { tone(320, 40, 0.7, 'sawtooth', 0.1); noise(0.35, 0.1); },
  win:   () => [0, 1, 2, 3, 4, 5].forEach(i => tone(523 * Math.pow(1.19, i), 523 * Math.pow(1.19, i), 0.22, 'square', 0.07, i * 0.12)),
  zone:  () => { tone(330, 660, 0.3, 'triangle', 0.07); tone(660, 990, 0.3, 'triangle', 0.05, 0.12); },
  point: () => tone(760, 760, 0.05, 'square', 0.03),
  click: () => tone(520, 520, 0.04, 'square', 0.04),
};
let musT = 0, musStep = 0;
function music(dt) {
  if (muted || !AC) return; musT -= dt; if (musT > 0) return;
  const fv = run.feverT > 0; musT = fv ? 0.12 : 0.2;
  const sc = [0, 3, 5, 7, 10, 12, 15, 12, 10, 7, 5, 3], root = [0, 0, -2, -4][(musStep >> 4) % 4] + (run.fight ? 3 : 0);
  const f = 220 * Math.pow(2, (sc[musStep % sc.length] + root) / 12);
  tone(f, f, 0.14, 'triangle', fv ? 0.035 : 0.022);
  if (musStep % 4 === 0) { const b = 55 * Math.pow(2, root / 12); tone(b, b, 0.32, 'sawtooth', 0.025); }
  musStep++;
}

// ---------- Derived stats ----------
const gravity  = () => 1350 * (tl('hull') >= 3 ? 0.95 : 1) * Math.pow(0.9, cl('feather'));
const flapV    = () => 420 * (tl('wing') >= 2 ? 1.06 : 1) * (1 + 0.06 * cl('flap'));
const maxFall  = () => 560 * Math.pow(0.75, cl('soft'));
const hitR     = () => tl('hull') >= 3 ? 8 : 9;
const gapBonus = () => (tl('wing') >= 1 ? 10 : 0) + (tl('wing') >= 4 ? 10 : 0) + 12 * cl('wide') + (run.feverT > 0 ? 26 : 0);
const scrapMul = () => (1 + (tl('salv') >= 1 ? 0.2 : 0) + (tl('salv') >= 4 ? 0.5 : 0) + 0.4 * cl('surge')) * (run.feverT > 0 ? 2 : 1);
const feverLen = () => 8 + (tl('wing') >= 4 ? 4 : 0);
const payRate  = () => tl('salv') >= 2 ? 6 : 4;
const mOf = () => run.dist / PPM;

// ---------- Run setup ----------
function newRun() {
  const sa = (!dailyMode && FX().workshop && save.startAlt) || 0;
  run = {
    t: 0, started: false, bird: { y: H / 2, vy: 0 }, dist: sa * PPM,
    pipes: [], scraps: [], drones: [], gears: [], pads: [], bubbles: [], bolts: [],
    genX: sa * PPM + W + 240, lastGy: H / 2, lastSp: 250,
    cards: {}, shields: (tl('hull') >= 1 ? 1 : 0) + (tl('hull') >= 2 ? 1 : 0),
    invuln: 0, boostT: 0, fever: 0, feverT: 0, wind: 0, windT: 0, boltT: 3,
    scrap: 0, exact: 0, payout: 0, maxM: sa, passed: 0, startAlt: sa,
    gi: FX().guardians ? GUARDS.findIndex(g => g.alt > sa) : -1, fight: null, nextBubble: (Math.floor(sa / 500) + 1) * 500,
    phoenix: false, killer: '', victory: false, zone: zoneOf(sa), lastFlap: -9,
  };
  genPipes();
}
function startRun(daily, startAlt) {
  dailyMode = daily === true;
  const seed = hashStr('flapocalypse-' + todayStr());
  seedRand = dailyMode ? mulberry(seed) : Math.random;
  pickRand = dailyMode ? mulberry(seed ^ 0x9e3779b9) : Math.random;
  state = 'play'; newRun();
  if (typeof startAlt === 'number') { run.dist = startAlt * PPM; run.maxM = startAlt; run.pipes = []; run.genX = run.dist + W + 240; run.gi = GUARDS.findIndex(g => g.alt > startAlt); genPipes(); }
}

// ---------- World generation (ahead of the camera, never depends on the player) ----------
const speedNow = () => ZSPD[zoneOf(mOf())] * (tl('wing') >= 3 ? 0.94 : 1) * Math.pow(0.92, cl('slow'));
function genLimit() { return run.gi >= 0 && run.gi < GUARDS.length ? GUARDS[run.gi].alt * PPM - 250 : 1e12; }
function genPipes() { while (run.genX < run.dist + W + 700 && run.genX < genLimit()) addPipe(); }
function addPipe() {
  const m = run.genX / PPM, z = zoneOf(m), base = ZGAP[z];
  const sp = ZSP[z] * grng(0.94, 1.06);
  const t = run.lastSp / ZSPD[z], d = clamp(170 * t, 70, 260);
  const lo = 70 + base / 2, hi = H - 70 - base / 2;
  const gy = clamp(grng(run.lastGy - d, run.lastGy + d * 1.25), lo, hi);
  run.lastGy = gy; run.lastSp = sp;
  const p = { x: run.genX, w: 58, gy, base, amp: z >= 1 ? grng(0, z >= 3 ? 70 : 50) : 0, ph: grng(0, 6.28), spd: grng(0.9, 1.7), z, passed: false, minEdge: 99, cy: gy, gap: base };
  run.pipes.push(p);
  if (FX().cards && m >= run.nextBubble) {
    const g0 = run.gi >= 0 && run.gi < GUARDS.length ? GUARDS[run.gi].alt : 1e9;
    if (run.nextBubble < g0 - 40) run.bubbles.push({ x: run.genX + p.w / 2, p, got: false });
    run.nextBubble += 500;
  }
  const midX = run.genX + sp * 0.5, roll = seedRand();
  if (roll < 0.34) { if (FX().drones) run.drones.push({ x: midX, y0: grng(130, H - 130), amp: grng(20, 70), ph: grng(0, 6.28), spd: grng(1.2, 2.2), dead: false, y: H / 2 }); }
  else if (roll < 0.56 && z >= 2) run.gears.push({ x: midX, y0: grng(170, H - 170), amp: grng(60, 130), ph: grng(0, 6.28), spd: grng(1.4, 2.4), a: 0, y: H / 2 });
  else if (roll < 0.62) { if (FX().pads) run.pads.push({ x: midX, y: grng(150, H - 150), got: false }); }
  if (seedRand() < 0.8 && FX().scrap) run.scraps.push({ x: midX + grng(-40, 40), y: grng(110, H - 110), r: 8, v: seedRand() < 0.1 ? 5 : 1 });
  run.genX += sp;
}

// ---------- Actions ----------
function flap() {
  if (state !== 'play') return;
  const b = run.bird;
  run.started = true; b.vy = -flapV(); run.lastFlap = run.t; SFX.flap();
  for (let i = 0; i < 4; i++) parts.push({ x: BX - 8, y: b.y + 6, vx: rng(-70, -20), vy: rng(10, 70), l: .35, c: '#e8eefc' });
}
function float(txt, x, y, c = '#fff') { floaters.push({ txt, x, y, c, l: 1 }); }
function addScrap(base, x, y) {
  if (!FX().scrap) return;
  run.exact += base * scrapMul();
  const n = Math.floor(run.exact) - run.scrap;
  run.scrap += n; if (n > 0) float('+' + n, x, y, '#ffd24a');
}
function addFever(n) {
  if (!FX().fever || run.feverT > 0 || run.fight) return;
  run.fever = Math.min(100, run.fever + n * Math.pow(1.4, cl('engine')));
  if (run.fever >= 100) { run.feverT = feverLen(); run.fever = 100; shake = 10; float('FEVER!', BX + 40, run.bird.y - 40, '#ff4fd8'); SFX.fever(); flash = { c: '#ff4fd8', a: .35 }; }
}
function hurt(why) {
  if (run.invuln > 0 || run.boostT > 0) return;
  if (run.shields > 0) {
    run.shields--; run.invuln = 1.4; shake = 8;
    float('SHIELD!', BX + 30, run.bird.y - 24, '#6fe3ff'); SFX.shield(); flash = { c: '#6fe3ff', a: .25 };
    return;
  }
  die(why);
}
function die(why) {
  if (tl('hull') >= 4 && !run.phoenix) {
    run.phoenix = true; run.shields = 1; run.invuln = 2.5; run.bird.vy = -320;
    float('PHOENIX!', BX + 30, run.bird.y - 30, '#ff9a3d'); shake = 12; return;
  }
  run.killer = why || 'a hazard';
  finish(false);
}
function finish(victory) {
  state = victory ? 'victory' : 'dead'; run.victory = victory; shake = 14; deadAt = performance.now();
  if (victory) SFX.win(); else SFX.die(); flash = { c: victory ? '#ffd24a' : '#fff', a: .6 };
  run.score = FX().junk ? run.maxM : run.passed;
  run.payout = FX().scrap ? Math.floor(run.maxM / 10) * payRate() + (victory ? 500 : 0) : 0;
  save.scrap += run.scrap + run.payout; save.runs++;
  run.newBest = Math.floor(run.score) > save.best; if (run.newBest) save.best = Math.floor(run.score);
  if (victory) save.summits++;
  if (dailyMode) {
    if (!save.daily || save.daily.date !== todayStr()) save.daily = { date: todayStr(), best: 0 };
    run.dailyNew = Math.floor(run.score) > save.daily.best; if (run.dailyNew) save.daily.best = Math.floor(run.score);
  }
  persist();
  for (let i = 0; i < 30; i++) parts.push({ x: BX, y: run.bird.y, vx: rng(-200, 200), vy: rng(-250, 150), l: rng(.4, 1), c: ['#ffd24a', '#ff6a3d', '#fff'][i % 3] });
}
function offerPick(rare) {
  const n = tl('salv') >= 3 ? 4 : 3;
  const pool = CARDS.filter(c => cl(c.id) < c.stack);
  const picks = [];
  while (picks.length < n && pool.length) picks.push(pool.splice((pickRand() * pool.length) | 0, 1)[0]);
  if (!picks.length) return;
  cards = picks; run.pickTitle = rare ? 'GUARDIAN DOWN - CLAIM A REWARD' : 'CARD BUBBLE - CHOOSE ONE'; state = 'pick';
}
function choose(i) {
  const c = cards[i]; if (!c) return;
  run.cards[c.id] = cl(c.id) + 1;
  if (c.id === 'shield') run.shields++;
  state = 'play';
}

// ---------- Guardian fights (horizontal beams across 5 lanes; fly into the blue cores) ----------
const LANE_H = H / 5;
function startFight() {
  const g = GUARDS[run.gi];
  run.fight = { gi: run.gi, hp: g.hits, step: 0, timer: 1.4, beams: [], cores: [], coreAt: 0, coreLane: 0 };
  run.pipes = []; run.drones = []; run.gears = []; run.pads = []; run.scraps = []; run.bolts = []; run.bubbles = [];
  float(g.name.toUpperCase(), W / 2, 200, '#ff6a3d'); shake = 8; flash = { c: '#ff6a3d', a: .3 };
}
function updateFight(dt) {
  const F = run.fight, g = GUARDS[F.gi], b = run.bird, r = hitR();
  F.timer -= dt;
  if (F.timer <= 0) {
    const lanes = g.pat[F.step % g.pat.length]; F.step++;
    for (const l of lanes) F.beams.push({ lane: l, t: 0, warn: 0.95, fire: 0.4 });
    F.coreAt = 0.95 + 0.4 + 0.1;
    const free = [0, 1, 2, 3, 4].filter(l => !lanes.includes(l)); F.coreLane = free[(Math.random() * free.length) | 0];
    F.timer = 2.2 - F.gi * 0.15;
  }
  if (F.coreAt > 0) { F.coreAt -= dt; if (F.coreAt <= 0) F.cores.push({ x: W + 20, y: F.coreLane * LANE_H + LANE_H / 2, t: 0 }); }
  for (const m of F.beams) {
    m.t += dt;
    const y0 = m.lane * LANE_H;
    if (m.t > m.warn && m.t < m.warn + m.fire && b.y + r > y0 && b.y - r < y0 + LANE_H) hurt(g.name);
  }
  F.beams = F.beams.filter(m => m.t < m.warn + m.fire);
  for (const c of F.cores) {
    c.t += dt; c.x -= 170 * dt;
    if (!c.got && Math.hypot(BX - c.x, b.y - c.y) < 26) {
      c.got = true; F.hp--; shake = 6; SFX.hit(); float('HIT!', c.x, c.y, '#6fe3ff');
      for (let i = 0; i < 12; i++) parts.push({ x: c.x, y: c.y, vx: rng(-150, 150), vy: rng(-150, 150), l: .5, c: '#6fe3ff' });
    }
  }

function drawMini(v, t, x, y, w, h, sc) {

  }
  const gap = 128 + (feverOn ? 26 : 0), top = sh - gh;
  const by = sh / 2 + Math.sin(t * 2.2) * sh * 0.12;
  for (let i = 0; i < 5; i++) {
    const px = (((i * 190 - t * sp) % 950) + 950) % 950 - 120, cy = sh / 2 + Math.sin(i * 2.1) * sh * 0.14;

    else { classicPipe(px, 0, cy - gap / 2, 58, true); classicPipe(px, cy + gap / 2, top, 58, false); }
    const ix = px + 124, iy = sh / 2 + Math.sin(i * 3.3 + t) * sh * 0.2, kind = i % 5;
    if (kind === 0 && f.scrap) { ctx.fillStyle = '#ffd24a'; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(ix + k * 22, iy - Math.abs(k - 1) * 8, 8, 0, 7); ctx.fill(); } }
    if (kind === 1 && f.drones) drawDrone({ y: iy }, ix);
    if (kind === 2 && f.pads) { ctx.fillStyle = '#ff9a3d'; rr(ix - 15, iy - 15, 30, 30, 8); ctx.fill(); ctx.fillStyle = '#ffd24a'; ctx.beginPath(); ctx.moveTo(ix + 9, iy); ctx.lineTo(ix - 5, iy - 9); ctx.lineTo(ix - 5, iy + 9); ctx.fill(); }
    if (kind === 3 && f.cards) { const qy = cy + Math.sin(t * 3) * 4; ctx.fillStyle = 'rgba(160,110,255,.35)'; ctx.beginPath(); ctx.arc(px + 29, qy, 20, 0, 7); ctx.fill(); ctx.strokeStyle = '#c9b0ff'; ctx.lineWidth = 2; ctx.stroke(); text('?', px + 29, qy, 20, '#fff'); }
    if (kind === 4 && f.zones && z >= 2) { ctx.save(); ctx.translate(ix, iy); ctx.rotate(t * 5); ctx.fillStyle = '#c0703c'; for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -22, 8, 8); } ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill(); ctx.fillStyle = '#1a0f0a'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); ctx.restore(); }
  }
  if (f.zones && z === 3 && (t % 3.5) > 2.5) { ctx.fillStyle = (t % 3.5) > 2.8 ? '#fff6a8' : 'rgba(255,255,120,.18)'; ctx.fillRect(250, 0, 44, sh); }
  if (f.guardians && (t % 10) > 6.5) {
    const ph = (t % 10) - 6.5, lh = sh / 5;
    for (const l of [1, 3]) { ctx.fillStyle = ph > 1.4 ? '#ff6a3d' : `rgba(255,80,60,${.15 + .15 * Math.sin(ph * 30)})`; ctx.fillRect(0, l * lh, W, lh); }
    ctx.fillStyle = '#6a6f90'; ctx.beginPath(); ctx.ellipse(W - 14, sh / 2, 36, 64, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(W - 34, sh / 2 - 12, 7, 0, 7); ctx.fill();
  }
  if (!f.junk) classicGround(t * sp, top);
  else { ctx.fillStyle = ZONES[z].sil; ctx.fillRect(0, top, W, gh); }
  const wing = Math.sin(t * 16), rot = Math.cos(t * 2.2) * 0.25;
  if (!f.junk) drawClassicBirdAt(110, by, rot, wing);
  else if (f.sprite && rivetOk) drawRivetSprite(110, by, rot, Math.floor(t * 14) % 8, feverOn, false, 1);
  else drawRivet(110, by, rot, wing, feverOn, false, 1);
  if (feverOn) { ctx.fillStyle = 'rgba(255,79,216,.14)'; ctx.fillRect(0, 0, W, sh); text('FEVER x2', 200, 40, 20, '#ff9be8'); }
  ctx.restore();
}

// ---------- Title and Updates screens ----------
let pv = ver, cmp = 0.5, dragging = false;
const PREV = { x: 20, y: 76, w: 360, h: 292 };
function drawTitle() {
  const t = performance.now() / 1000, V = VERS[ver - 1];
  inWorld = true; drawMini(ver, t, 0, 0, W, H); inWorld = false; pixelate(0, 0, W, H); flushText();
  ctx.fillStyle = 'rgba(8,10,20,.55)'; ctx.fillRect(0, 0, W, H);
  outlined('FLAPOCALYPSE', W / 2, 150, 40);
  rr(W / 2 - 110, 190, 220, 30, 15); ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fill();
  text(`v${V.v} · ${V.name}`, W / 2, 205, 14, '#ffd24a');
  btn(`PLAY`, 60, 300, 280, 64, () => startRun(false), { color: '#e0753a', size: 30 });
  if (FX().workshop) btn('WORKSHOP', 60, 380, 280, 46, () => { state = 'menu'; }, { color: '#3c6df0', size: 18 });
  btn('UPDATES', 60, FX().workshop ? 442 : 380, 280, 46, () => { pv = ver; cmp = 0.5; state = 'updates'; }, { color: '#7a4fe0', size: 18 });
  muteBtn(W - 30, 28);
  text(`${LATEST} updates so far. See what changed in each one.`, W / 2, H - 26, 12, '#b8c4ea', 'center', false);
}
function drawUpdates() {
  const t = performance.now() / 1000, P = PREV, V = VERS[pv - 1];
  ctx.fillStyle = '#0d1424'; ctx.fillRect(0, 0, W, H);
  text('UPDATES', W / 2, 30, 28, '#ffd24a');
  text(pv === 1 ? 'This is where it started.' : 'Drag to compare with the base game', W / 2, 56, 12, '#9aa6c8', 'center', false);
  // live preview with compare slider: both scenes are drawn, snapped to the pixel grid, then the slider goes on top
  const sx = P.x + P.w * cmp;
  inWorld = true;
  drawMini(1, t, P.x, P.y, P.w, P.h, 1);
  if (pv > 1) { ctx.save(); ctx.beginPath(); ctx.rect(sx, P.y, P.x + P.w - sx, P.h); ctx.clip(); drawMini(pv, t, P.x, P.y, P.w, P.h, 1); ctx.restore(); }
  inWorld = false; pixelate(P.x, P.y, P.w, P.h); flushText();
  if (pv > 1) {
    ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(sx / 4) * 4 - 2, P.y, 4, P.h);
    const gx = Math.round(sx / 4) * 4; rr(gx - 18, P.y + P.h / 2 - 14, 36, 28, 8); ctx.fillStyle = '#fff'; ctx.fill();
    text('‹ ›', gx, P.y + P.h / 2 + 1, 16, '#10131f');
    rr(P.x + 8, P.y + 8, 84, 22, 8); ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fill(); text('v1.0 BASE', P.x + 50, P.y + 19, 11, '#fff');
    rr(P.x + P.w - 76, P.y + 8, 68, 22, 8); ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fill(); text(`v${V.v}`, P.x + P.w - 42, P.y + 19, 11, '#ffd24a');
  }
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; rr(P.x, P.y, P.w, P.h, 4); ctx.stroke();
  // version chips
  const cw = 52, gap = 8, x0 = (W - (LATEST * cw + (LATEST - 1) * gap)) / 2;
  for (let i = 1; i <= LATEST; i++) {
    const cx = x0 + (i - 1) * (cw + gap), sel = i === pv;
    btn(VERS[i - 1].v, cx, 382, cw, 32, () => { pv = i; }, { color: sel ? '#e0753a' : (i === ver ? '#3c6df0' : '#2a3350'), size: 14 });
  }
  // details card
  rr(20, 424, 360, 148, 10); ctx.fillStyle = '#1b2442'; ctx.fill();
  text(`${V.v}  ${V.name}`, 32, 444, 18, '#fff', 'left');
  text(V.sum, 32, 466, 12, '#b8c4ea', 'left', false);
  text('Looks like: ' + V.visual, 32, 484, 11.5, '#ffd24a', 'left', false);
  V.notes.forEach((n, i) => text('• ' + n, 32, 506 + i * 15, 11.5, '#d6def5', 'left', false));
  btn('BACK', 20, 584, 90, 44, () => { state = 'title'; }, { size: 16, color: '#2a3350' });
  btn(pv === ver ? `PLAY v${V.v}` : `PLAY v${V.v} INSTEAD`, 120, 584, 260, 44, () => { selectVer(pv); startRun(false); }, { size: 17, color: '#e0753a' });
}

function render() {
  buttons = []; deferred = []; inWorld = false;
  if (state === 'title' || state === 'updates' || state === 'menu') {
    pixText = true; ctx.save(); ctx.imageSmoothingEnabled = false;
    if (state === 'title') drawTitle(); else if (state === 'updates') drawUpdates(); else drawMenu();
    ctx.restore(); return;
  }
  const J = FX().junk, PX = !!FX().pixel;
  pixText = PX; inWorld = PX;
  ctx.save();
  if (shake > 0 && J) ctx.translate(rng(-shake, shake) / 2, rng(-shake, shake) / 2);
  drawWorld(); drawBird();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.l * 2); ctx.fillStyle = p.c; const q = PX ? 4 : 3; ctx.fillRect(PX ? Math.round(p.x / 4) * 4 : p.x, PX ? Math.round(p.y / 4) * 4 : p.y, q, q); }
  ctx.globalAlpha = 1;
  ctx.restore();
  inWorld = false;
  if (PX) { pixelate(0, 0, W, H); flushText(); }
  ctx.save();
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.l * 2); text(f.txt, f.x, f.y, 15, f.c); }
  ctx.globalAlpha = 1;
  if (flash.a > 0 && J) { ctx.globalAlpha = flash.a; ctx.fillStyle = flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state !== 'dead' && state !== 'victory') { if (J) drawHUD(); else drawClassicHUD(); }
  if (state === 'pick') drawPick();
  if (state === 'dead' || state === 'victory') { if (J) drawEnd(); else drawClassicEnd(); }
  ctx.restore();
}

// ---------- Loop & input (one button: tap anywhere / space) ----------
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  update(dt); render(); requestAnimationFrame(frame);
}
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function pointer(e) {
  e.preventDefault(); ac();
  const [x, y] = toLogical(e);
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.click(); b.onClick(); return; }
  if (state === 'updates' && x >= PREV.x && x <= PREV.x + PREV.w && y >= PREV.y && y <= PREV.y + PREV.h) { dragging = true; cmp = clamp((x - PREV.x) / PREV.w, 0.03, 0.97); return; }
  flap();
}
cv.addEventListener('pointerdown', pointer);
cv.addEventListener('pointermove', e => { if (dragging) { const [x] = toLogical(e); cmp = clamp((x - PREV.x) / PREV.w, 0.03, 0.97); } });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('keydown', e => {
  const k = e.code; ac();
  if (state === 'updates') {
    if (k === 'ArrowLeft') pv = Math.max(1, pv - 1); else if (k === 'ArrowRight') pv = Math.min(LATEST, pv + 1); else if (k === 'Escape') state = 'title';
    return;
  }
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') {
    e.preventDefault();
    if (state === 'dead' || state === 'victory') { if (performance.now() - deadAt > 500) startRun(dailyMode); }
    else if (state === 'title' || state === 'menu') startRun(false); else flap();
  }
  else if (state === 'pick' && e.key >= '1' && e.key <= '9') choose(+e.key - 1);
  else if (e.key === 'Enter' && (state === 'menu' || state === 'title')) startRun(false);
});

newRun();
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, set state(v) { state = v; }, get run() { return run; }, get save() { return save; }, selectVer, VERS, get ver() { return ver; }, startRun, flap, choose, get cards() { return cards; }, SUMMIT, GUARDS, die };
</script>
