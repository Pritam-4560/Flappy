<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flapocalypse</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:400/640;background:#141b2e}
</style>
</head>
<body>
<canvas id="c" width="400" height="640"></canvas>
<script>
"use strict";
// ============================ FLAPOCALYPSE: THE BIG CLIMB ============================
// One huge vertical map. Climb until the tank runs dry, bank scrap, upgrade, climb higher.
// Goal: reach the summit (5,000 m) in a single run.
const W = 400, H = 640, PPM = 30, SUMMIT = 5000;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- Map ----------
const ZONES = [
  { n: 'The Junkyard',    to: 800,  sky: ['#2c2616', '#15120a'], bar: '#9a8650' },
  { n: 'The Smog Works',  to: 2000, sky: ['#2d2238', '#150f1d'], bar: '#8e6bb0' },
  { n: 'Rust Pipes',      to: 3200, sky: ['#3a2418', '#1a0f0a'], bar: '#c0703c' },
  { n: 'The Storm Spire', to: 4400, sky: ['#17263d', '#0a1220'], bar: '#5aa0d8' },
  { n: 'The Summit',      to: 5000, sky: ['#2a1a3d', '#0a0814'], bar: '#e8c24a' },
];
const GUARDS = [
  { alt: 800,  name: 'Junk Hawk',        hits: 3, reward: 50,  pat: [[0], [4], [2], [0, 4], [1], [3]] },
  { alt: 2000, name: 'The Great Pigeon', hits: 5, reward: 100, pat: [[0], [4], [2], [1, 3], [0, 2], [2, 4], [1, 3]] },
  { alt: 5000, name: 'Storm Engine',     hits: 7, reward: 200, pat: [[1, 3], [0, 2, 4], [2], [0, 1], [3, 4], [0, 4], [1, 2, 3]] },
];
const zoneOf = m => { const i = ZONES.findIndex(z => m < z.to); return i < 0 ? ZONES.length - 1 : i; };
const yAlt = m => -m * PPM, altOf = y => -y / PPM;

// ---------- Save ----------
const SAVE_KEY = 'flapocalypse.v2';
let save = { scrap: 0, best: 0, runs: 0, summits: 0, tier: { surv: 0, salv: 0, eng: 0 }, beaten: {}, cannon: {}, startAlt: 0, daily: null };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
  Object.assign(save, s); save.tier = Object.assign({ surv: 0, salv: 0, eng: 0 }, s.tier);
  save.beaten = s.beaten || {}; save.cannon = s.cannon || {};
} catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- Workshop (permanent) ----------
const TIER_COST = [100, 400, 1200, 3000];
const BRANCHES = [
  { id: 'surv', name: 'Survival', tiers: ['Start with 1 shield', 'Start with 2 shields', 'Lighter frame: gravity -5%, smaller hitbox', 'Phoenix Core: revive once per run'] },
  { id: 'salv', name: 'Salvage',  tiers: ['+20% scrap', 'Survival bonus: 3 scrap per 10 m', 'Card bubbles offer 4 cards', '+50% scrap, scrap refills more tank'] },
  { id: 'eng',  name: 'Engine',   tiers: ['Boost Tank +25%', 'Flap power +8%', 'Launchers last 40% longer, Fever starts at 30', 'Fever lasts 4 s longer'] },
];
const CANNONS = [{ g: 0, alt: 800, cost: 500 }, { g: 1, alt: 2000, cost: 1500 }];

// ---------- Cards (found in bubbles during a run) ----------
const CARDS = [
  { id: 'feather', name: 'Featherweight',  desc: 'Gravity -10%',                  stack: 3 },
  { id: 'flap',    name: 'Strong Flap',    desc: 'Flap power +8%',                stack: 3 },
  { id: 'tank',    name: 'Fuel Cell',      desc: 'Tank +12% and refill 12',       stack: 3 },
  { id: 'shield',  name: 'Bubble',         desc: '+1 shield (max 2 from cards)',  stack: 2 },
  { id: 'magnet',  name: 'Scrap Magnet',   desc: 'Pull scrap from farther away',  stack: 3 },
  { id: 'surge',   name: 'Scrap Surge',    desc: '+40% scrap this run',           stack: 3 },
  { id: 'soft',    name: 'Soft Landing',   desc: 'Fall speed -25%',               stack: 2 },
  { id: 'engine',  name: 'Chaos Engine',   desc: 'Fever fills 40% faster',        stack: 2 },
  { id: 'spring',  name: 'Stomp Spring',   desc: 'Stomp bounce +25%',             stack: 2 },
  { id: 'wide',    name: 'Wide Berth',     desc: 'Gaps +14px wider',              stack: 3 },
];

// ---------- RNG: gameplay is seeded so the Daily Run is identical for everyone ----------
let dailyMode = false, seedRand = Math.random, pickRand = Math.random;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const grng = (a, b) => a + seedRand() * (b - a);
const rng = (a, b) => a + Math.random() * (b - a);
const todayStr = () => new Date().toISOString().slice(0, 10);
const dayNumber = () => Math.floor(Date.parse(todayStr()) / 864e5) - 20000;
const hashStr = t => { let h = 2166136261; for (const ch of t) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };

// ---------- State ----------
let state = 'menu';             // menu | play | pick | dead | victory
let run, buttons = [], cards = [], parts = [], floaters = [];
let last = 0, shake = 0, deadAt = 0, copied = 0, zoneToast = { t: 0, txt: '' }, flash = { c: '#fff', a: 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- Audio (synthesised, no files) ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('fl.mute') === '1'; } catch (e) {}
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'square', vol = 0.06, delay = 0) {
  if (muted) return; const a = AC; if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.08) {
  if (muted) return; const a = AC; if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(), g = a.createGain(); src.buffer = buf; g.gain.value = vol; src.connect(g); g.connect(a.destination); src.start();
}
const SFX = {
  flap:  () => tone(360 + Math.random() * 50, 170, 0.09, 'square', 0.04),
  scrap: () => { tone(900, 1350, 0.07, 'triangle', 0.07); tone(1350, 1800, 0.07, 'triangle', 0.05, 0.05); },
  stomp: () => { tone(320, 70, 0.16, 'square', 0.09); noise(0.1, 0.07); },
  launch: () => { tone(110, 900, 0.55, 'sawtooth', 0.07); noise(0.45, 0.06); },
  shield: () => { tone(620, 280, 0.22, 'triangle', 0.09); },
  fever: () => [0, 1, 2, 3].forEach(i => tone(440 * Math.pow(1.26, i), 440 * Math.pow(1.26, i), 0.12, 'square', 0.06, i * 0.07)),
  hit:   () => { tone(700, 1500, 0.14, 'triangle', 0.09); noise(0.06, 0.05); },
  die:   () => { tone(320, 40, 0.7, 'sawtooth', 0.1); noise(0.35, 0.1); },
  win:   () => [0, 1, 2, 3, 4, 5].forEach(i => tone(523 * Math.pow(1.19, i), 523 * Math.pow(1.19, i), 0.22, 'square', 0.07, i * 0.12)),
  zone:  () => { tone(330, 660, 0.3, 'triangle', 0.07); tone(660, 990, 0.3, 'triangle', 0.05, 0.12); },
  click: () => tone(520, 520, 0.04, 'square', 0.04),
};
let musT = 0, musStep = 0;
function music(dt) {
  if (muted || !AC) return; musT -= dt; if (musT > 0) return;
  const fv = run.feverT > 0; musT = fv ? 0.12 : 0.2;
  const sc = [0, 3, 5, 7, 10, 12, 15, 12, 10, 7, 5, 3], root = [0, 0, -2, -4][(musStep >> 4) % 4] + (run.fight ? 3 : 0);
  const f = 220 * Math.pow(2, (sc[musStep % sc.length] + root) / 12);
  tone(f, f, 0.14, 'triangle', fv ? 0.035 : 0.022);
  if (musStep % 4 === 0) { const b = 55 * Math.pow(2, root / 12); tone(b, b, 0.32, 'sawtooth', 0.025); }
  musStep++;
}
const tl = id => (dailyMode && state !== 'menu' && state !== 'dead' && state !== 'victory') ? 0 : (save.tier[id] || 0);
const cl = id => (run && run.cards[id]) || 0;

// ---------- Derived stats ----------
const tankMax  = () => 45 * (tl('eng') >= 1 ? 1.25 : 1) * (1 + 0.12 * cl('tank'));
const flapV    = () => 400 * (tl('eng') >= 2 ? 1.08 : 1) * (1 + 0.08 * cl('flap'));
const gravity  = () => 1000 * (tl('surv') >= 3 ? 0.95 : 1) * Math.pow(0.9, cl('feather'));
const maxFall  = () => 430 * Math.pow(0.75, cl('soft'));
const hitR     = () => tl('surv') >= 3 ? 8 : 9;
const gapBonus = () => 14 * cl('wide');
const scrapMul = () => (1 + (tl('salv') >= 1 ? 0.2 : 0) + (tl('salv') >= 4 ? 0.3 : 0) + 0.4 * cl('surge')) * (run.feverT > 0 ? 2 : 1);
const feverLen = () => 8 + (tl('eng') >= 4 ? 4 : 0);
const payRate  = () => tl('salv') >= 2 ? 3 : 2;

// ---------- Run setup ----------
function newRun() {
  const sa = (!dailyMode && save.startAlt) || 0;
  const gi = GUARDS.findIndex(g => g.alt > sa);
  run = {
    t: 0, started: false, bird: { x: W / 2, y: yAlt(sa), vx: 0, vy: 0 }, cam: yAlt(sa) - 360,
    rows: [], drones: [], gears: [], pads: [], scraps: [], bolts: [], genY: yAlt(sa) - 300,
    tank: 0, cards: {}, shields: (tl('surv') >= 1 ? 1 : 0) + (tl('surv') >= 2 ? 1 : 0),
    invuln: 0, boostT: 0, fever: tl('eng') >= 3 ? 30 : 0, feverT: 0, wind: 0, windT: 0, boltT: 3,
    scrap: 0, exact: 0, payout: 0, maxAlt: sa, startAlt: sa, gi, fight: null, nextPick: (Math.floor(sa / 500) + 1) * 500,
    phoenix: false, killer: '', victory: false, zone: zoneOf(sa),
  };
  run.tank = tankMax();
  genRows();
}

function startRun(daily, startAlt) {
  dailyMode = daily === true;
  const seed = hashStr('flapocalypse-' + todayStr());
  seedRand = dailyMode ? mulberry(seed) : Math.random;
  pickRand = dailyMode ? mulberry(seed ^ 0x9e3779b9) : Math.random;
  state = 'play'; newRun();
  if (typeof startAlt === 'number') { run.bird.y = yAlt(startAlt); run.maxAlt = startAlt; }
}

// ---------- World generation (always ahead of the camera, never depends on the player) ----------
function genLimit() { return run.gi >= 0 && run.gi < GUARDS.length ? yAlt(GUARDS[run.gi].alt) + 220 : -1e9; }
function genRows() {
  while (run.genY > run.cam - 900 && run.genY > genLimit()) addRow();
}
function addRow() {
  const m = altOf(run.genY), z = zoneOf(m);
  const spacing = [230, 210, 190, 180, 170][z] * grng(0.92, 1.08);
  const gw = [200, 178, 158, 142, 128][z];
  const gx = grng(gw / 2 + 24, W - gw / 2 - 24);
  const row = { y: run.genY, gx, gw, amp: z >= 1 ? grng(0, 60) : 0, ph: grng(0, 6.28), spd: grng(0.8, 1.6), z, nearDone: false };
  run.rows.push(row);
  const roll = seedRand();
  const midY = run.genY + spacing * 0.5;
  if (roll < 0.4) run.drones.push({ x: grng(40, W - 40), y: midY, vx: (seedRand() < 0.5 ? -1 : 1) * grng(50, 95), dead: false });
  else if (roll < 0.62 && z >= 2) run.gears.push({ x: grng(40, W - 40), y: midY, vx: (seedRand() < 0.5 ? -1 : 1) * grng(70, 120), a: 0 });
  if (seedRand() < 0.08) run.pads.push({ x: grng(60, W - 60), y: run.genY + spacing * 0.8, got: false });
  if (seedRand() < 0.85) run.scraps.push({ x: grng(40, W - 40), y: run.genY - spacing * 0.45, r: 8, v: seedRand() < 0.1 ? 5 : 1 });
  run.genY -= spacing;
}
const rowGap = r => {
  const gw = r.gw + gapBonus();
  return { gw, cx: clamp(r.gx + r.amp * Math.sin(r.ph + run.t * r.spd), gw / 2 + 8, W - gw / 2 - 8) };
};

// ---------- Actions ----------
function flap(dir) {
  if (state !== 'play') return;
  const b = run.bird;
  if (run.fight && run.fight.dead) return;
  run.started = true;
  b.vy = -flapV();
  if (dir) b.vx = clamp(b.vx + dir * 230, -270, 270);
  run.tank -= 0.12; run.lastFlap = run.t; SFX.flap();
  for (let i = 0; i < 4; i++) parts.push({ x: b.x, y: b.y + 8, vx: rng(-40, 40), vy: rng(20, 90), l: .35, c: '#e8eefc' });
}
function float(txt, x, y, c = '#fff') { floaters.push({ txt, x, y, c, l: 1, world: true }); }
function addScrap(base, x, y) {
  run.exact += base * scrapMul();
  const n = Math.floor(run.exact) - run.scrap;
  run.scrap += n; if (n > 0) float('+' + n, x, y, '#ffd24a');
}
function addFever(n) {
  if (run.feverT > 0 || run.fight) return;
  run.fever = Math.min(100, run.fever + n * Math.pow(1.4, cl('engine')));
  if (run.fever >= 100) { run.feverT = feverLen(); run.fever = 100; shake = 10; float('FEVER!', run.bird.x, run.bird.y - 40, '#ff4fd8'); SFX.fever(); flash = { c: '#ff4fd8', a: .35 }; }
}
function hurt(why) {
  if (run.invuln > 0 || run.boostT > 0) return;
  if (run.shields > 0) {
    run.shields--; run.invuln = 1.3; shake = 8;
    float('SHIELD!', run.bird.x, run.bird.y - 24, '#6fe3ff'); SFX.shield(); flash = { c: '#6fe3ff', a: .25 };
    return;
  }
  die(why);
}
function die(why) {
  if (tl('surv') >= 4 && !run.phoenix) {
    run.phoenix = true; run.shields = 1; run.invuln = 2.5; run.tank = Math.max(run.tank, tankMax() * 0.5); run.bird.vy = -300;
    float('PHOENIX!', run.bird.x, run.bird.y - 30, '#ff9a3d'); shake = 12; return;
  }
  run.killer = why || 'a hazard';
  finish(false);
}
function finish(victory) {
  state = victory ? 'victory' : 'dead'; run.victory = victory; shake = 14; deadAt = performance.now();
  if (victory) SFX.win(); else SFX.die(); flash = { c: victory ? '#ffd24a' : '#fff', a: .6 };
  run.payout = Math.floor(run.maxAlt / 10) * payRate() + (victory ? 500 : 0);
  save.scrap += run.scrap + run.payout; save.runs++;
  run.newBest = Math.floor(run.maxAlt) > save.best; if (run.newBest) save.best = Math.floor(run.maxAlt);
  if (victory) save.summits++;
  if (dailyMode) {
    if (!save.daily || save.daily.date !== todayStr()) save.daily = { date: todayStr(), best: 0 };
    run.dailyNew = Math.floor(run.maxAlt) > save.daily.best; if (run.dailyNew) save.daily.best = Math.floor(run.maxAlt);
  }
  persist();
  for (let i = 0; i < 30; i++) parts.push({ x: run.bird.x, y: run.bird.y, vx: rng(-200, 200), vy: rng(-250, 150), l: rng(.4, 1), c: ['#ffd24a', '#ff6a3d', '#fff'][i % 3] });
}

function offerPick(rare) {
  const n = tl('salv') >= 3 ? 4 : 3;
  const pool = CARDS.filter(c => cl(c.id) < c.stack);
  const picks = [];
  while (picks.length < n && pool.length) picks.push(pool.splice((pickRand() * pool.length) | 0, 1)[0]);
  if (!picks.length) return;
  cards = picks; run.pickTitle = rare ? 'GUARDIAN DOWN - CLAIM A REWARD' : 'CARD BUBBLE - CHOOSE ONE'; state = 'pick';
}
function choose(i) {
  const c = cards[i]; if (!c) return;
  run.cards[c.id] = cl(c.id) + 1;
  if (c.id === 'shield') run.shields++;
  if (c.id === 'tank') run.tank = Math.min(tankMax(), run.tank + 12);
  state = 'play';
}

// ---------- Guardian fights ----------
const LANE_W = W / 5;
function startFight() {
  const g = GUARDS[run.gi];
  run.fight = { gi: run.gi, hp: g.hits, step: 0, timer: 1.4, camY: run.bird.y - 300, beams: [], cores: [], coreAt: 0, coreLane: 0, dead: false };
  run.cam = run.fight.camY;
  run.rows = []; run.drones = []; run.gears = []; run.pads = []; run.scraps = []; run.bolts = [];
  float(g.name.toUpperCase(), W / 2, run.fight.camY + 120, '#ff6a3d'); shake = 8;
}
function updateFight(dt) {
  const F = run.fight, g = GUARDS[F.gi], b = run.bird;
  F.timer -= dt;
  if (F.timer <= 0) {
    const lanes = g.pat[F.step % g.pat.length]; F.step++;
    for (const l of lanes) F.beams.push({ lane: l, t: 0, warn: 0.9, fire: 0.4 });
    F.coreAt = 0.9 + 0.4 + 0.15;
    const free = [0, 1, 2, 3, 4].filter(l => !lanes.includes(l)); F.coreLane = free[(Math.random() * free.length) | 0];
    F.timer = 2.1 - F.gi * 0.15;
  }
  if (F.coreAt > 0) {
    F.coreAt -= dt;
    if (F.coreAt <= 0) F.cores.push({ x: F.coreLane * LANE_W + LANE_W / 2, y: F.camY + rng(140, H - 140), t: 0, life: 4 });
  }
  for (const m of F.beams) {
    m.t += dt;
    const x0 = m.lane * LANE_W;
    if (m.t > m.warn && m.t < m.warn + m.fire && b.x + hitR() > x0 && b.x - hitR() < x0 + LANE_W) hurt(g.name);
  }
  F.beams = F.beams.filter(m => m.t < m.warn + m.fire);
  for (const c of F.cores) {
    c.t += dt;
    if (!c.got && Math.hypot(b.x - c.x, b.y - c.y) < 24) {
      c.got = true; F.hp--; shake = 6; SFX.hit(); float('HIT!', c.x, c.y, '#6fe3ff');
      for (let i = 0; i < 12; i++) parts.push({ x: c.x, y: c.y, vx: rng(-150, 150), vy: rng(-150, 150), l: .5, c: '#6fe3ff' });
    }
  }
  F.cores = F.cores.filter(c => !c.got && c.t < c.life);
  if (F.hp <= 0) endFight();
}
function endFight() {
  const F = run.fight, g = GUARDS[F.gi];
  save.beaten[F.gi] = true;
  addScrap(g.reward / scrapMul(), W / 2, F.camY + 200);
  run.tank = Math.min(tankMax(), run.tank + tankMax() * 0.4); run.shields = Math.min(3, run.shields + 1);
  run.fight = null; run.gi = F.gi + 1; run.beams = [];
  if (F.gi === GUARDS.length - 1) { run.maxAlt = SUMMIT; finish(true); return; }
  run.genY = run.bird.y - 260; run.cam = run.bird.y - 360; genRows();
  persist(); offerPick(true);
}

// ---------- Update ----------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  if (flash.a > 0) flash.a = Math.max(0, flash.a - dt * 2.2);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  for (const f of floaters) { f.y -= 30 * dt; f.l -= dt; }
  floaters = floaters.filter(f => f.l > 0);
  if (zoneToast.t > 0) zoneToast.t -= dt;
  if (state !== 'play') return;

  const b = run.bird, F = run.fight;
  run.t += dt; music(dt);
  if (run.invuln > 0) run.invuln -= dt;
  if (run.feverT > 0) { run.feverT -= dt; if (run.feverT <= 0) { run.fever = 0; float('fever over', b.x, b.y - 30, '#aaa'); } }

  if (!run.started) { b.y = run.bird.y; b.vx *= 0.9; run.cam += ((b.y - 360) - run.cam) * Math.min(1, 8 * dt); return; }

  // physics
  const z = zoneOf(altOf(b.y));
  if (z >= 3 && !F) { run.windT -= dt; if (run.windT <= 0) { run.wind = [-1, 0, 1][(seedRand() * 3) | 0]; run.windT = 4; } } else run.wind = 0;
  if (run.boostT > 0) { run.boostT -= dt; b.vy = -1400; run.invuln = Math.max(run.invuln, 0.3); }
  else b.vy = Math.min(maxFall(), b.vy + gravity() * dt);
  b.vx += run.wind * 170 * dt; b.vx *= Math.exp(-2 * dt);
  b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < 12) { b.x = 12; b.vx = Math.abs(b.vx) * 0.3; } if (b.x > W - 12) { b.x = W - 12; b.vx = -Math.abs(b.vx) * 0.3; }

  // tank
  if (!F && run.boostT <= 0) run.tank -= dt * (run.feverT > 0 ? 0.3 : 1);
  if (run.tank <= 0) { run.tank = 0; die('an empty tank'); if (state !== 'play') return; }

  if (F) {
    // arena: screen is locked, floor bounces, ceiling clamps
    const floor = F.camY + H - 26;
    if (b.y > floor) { b.y = floor; b.vy = -320; }
    if (b.y < F.camY + 24) { b.y = F.camY + 24; b.vy = 0; }
    run.cam = F.camY;
    updateFight(dt);
    return;
  }

  // camera follows upward, eases down
  run.cam += ((b.y - 360) - run.cam) * Math.min(1, 7 * dt);
  genRows();
  const m = altOf(b.y);
  if (m > run.maxAlt) run.maxAlt = m;
  const nz = zoneOf(run.maxAlt);

function shareText() {
  const head = dailyMode ? `FLAPOCALYPSE Daily #${dayNumber()}` : 'FLAPOCALYPSE';
  const near = !run.victory ? `\n${fmt(SUMMIT - run.maxAlt)} m from the summit.` : '\nREACHED THE SUMMIT!';
  return `${head}\n🧗 ${fmt(run.maxAlt)} m of ${fmt(SUMMIT)} m\n💀 ${run.victory ? 'Beat all 3 guardians' : 'Ended by ' + run.killer}${near}\nCan you climb higher?`;
}
function shareRun() {
  const done = () => { copied = performance.now(); };
  try { navigator.clipboard.writeText(shareText()).then(done, done); } catch (e) { done(); }
}
function drawEnd() {
  ctx.fillStyle = 'rgba(5,8,16,.8)'; ctx.fillRect(0, 0, W, H);
  const v = run.victory;
  text(v ? 'SUMMIT REACHED!' : 'CLIMB OVER', W / 2, 72, 34, v ? '#ffd24a' : '#ff6a3d');
  text(`${dailyMode ? 'Daily #' + dayNumber() + ' · ' : ''}${v ? 'you beat all 3 guardians' : 'ended by ' + run.killer}`, W / 2, 104, 13, '#b8c4ea', 'center', false);
  text(`${fmt(run.maxAlt)} m`, W / 2, 148, 42, '#fff');
  text(run.newBest ? 'NEW BEST!' : `best ${fmt(save.best)} m`, W / 2, 182, 14, run.newBest ? '#6fe3ff' : '#9aa6c8');
  // map progress
  ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(40, 204, W - 80, 12, 6); ctx.fill();
  ctx.fillStyle = '#ffd24a'; rr(40, 204, (W - 80) * clamp(run.maxAlt / SUMMIT, 0, 1), 12, 6); ctx.fill();
  for (const gd of GUARDS) { ctx.fillStyle = '#ff6a3d'; ctx.fillRect(40 + (W - 80) * gd.alt / SUMMIT - 1, 200, 3, 20); }
  const ng = GUARDS.find(gd => gd.alt > run.maxAlt);
  text(v ? 'The whole map, in one run.' : (ng ? `${fmt(ng.alt - run.maxAlt)} m to ${ng.name}` : ''), W / 2, 234, 13, '#ffb199', 'center', false);
  text(`Scrap: +${run.scrap + run.payout}  (${run.scrap} collected + ${run.payout} climb bonus)`, W / 2, 268, 14, '#ffd24a');
  text(`Total scrap: ${fmt(save.scrap)}`, W / 2, 290, 13, '#ffd24a', 'center', false);
  const goal = nextGoal();
  if (goal) {
    const f = Math.min(1, save.scrap / goal.cost);
    text(f >= 1 ? `You can afford ${goal.name}!` : `Next: ${goal.name}  ${fmt(save.scrap)}/${fmt(goal.cost)}`, W / 2, 322, 15, f >= 1 ? '#6fe3ff' : '#fff');
    ctx.fillStyle = 'rgba(255,255,255,.12)'; rr(70, 340, W - 140, 12, 6); ctx.fill();
    ctx.fillStyle = f >= 1 ? '#6fe3ff' : '#ffd24a'; rr(70, 340, (W - 140) * f, 12, 6); ctx.fill();
  }
  const ok = () => performance.now() - deadAt > 500;
  btn('CLIMB AGAIN', 60, 388, W - 120, 60, () => { if (ok()) startRun(dailyMode); }, { color: '#e0753a', size: 24 });
  btn('WORKSHOP', 60, 464, 130, 44, () => { if (ok()) { state = 'menu'; dailyMode = false; } }, { size: 16 });
  const just = performance.now() - copied < 1800;
  btn(just ? 'COPIED!' : 'SHARE', 210, 464, 130, 44, () => { if (ok()) shareRun(); }, { size: 16, color: '#2f9e5e' });
  if (just) text('result copied - paste it anywhere', W / 2, 530, 12, '#6fe3ff', 'center', false);
}

// ---------- Menu / Workshop ----------
function muteBtn2() {
  buttons.push({ x: W - 44, y: 14, w: 36, h: 28, onClick: () => { muted = !muted; try { localStorage.setItem('fl.mute', muted ? '1' : '0'); } catch (e) {} } });
  text(muted ? '🔇' : '🔊', W - 26, 28, 16);
}
function drawMenu() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#16213d'); g.addColorStop(1, '#0d1424'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text('FLAPOCALYPSE', W / 2, 34, 30, '#ffd24a');
  drawRivet(40, 34, -0.15, Math.sin(performance.now() / 120) * 0.8, false, false, 1, 1); muteBtn2();
  text(`⚙ ${fmt(save.scrap)}   ·   best ${fmt(save.best)} m of ${fmt(SUMMIT)}   ·   summits ${save.summits}`, W / 2, 64, 13, '#b8c4ea', 'center', false);
  const rowH = 92;
  BRANCHES.forEach((b, i) => {
    const y = 84 + i * (rowH + 8), t = save.tier[b.id], maxed = t >= 4, cost = TIER_COST[t], can = !maxed && save.scrap >= cost;
    rr(20, y, W - 40, rowH, 10); ctx.fillStyle = '#1b2442'; ctx.fill();
    text(b.name, 32, y + 20, 16, '#fff', 'left');
    for (let k = 0; k < 4; k++) { ctx.fillStyle = k < t ? '#ffd24a' : 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(120 + k * 18, y + 20, 6, 0, 7); ctx.fill(); }
    text(maxed ? 'Fully upgraded' : b.tiers[t], 32, y + 52, 12, '#b8c4ea', 'left', false);
    if (t > 0) text('now: ' + b.tiers[t - 1], 32, y + 74, 10.5, '#7b86a8', 'left', false);
    btn(maxed ? 'MAX' : `⚙ ${fmt(cost)}`, W - 124, y + 24, 92, 44, () => { if (can) { save.scrap -= cost; save.tier[b.id] = t + 1; persist(); } }, { disabled: !can, color: '#2f9e5e', size: 15 });
  });
  // shortcut cannons
  const cy = 84 + 3 * (rowH + 8);
  rr(20, cy, W - 40, 78, 10); ctx.fillStyle = '#1b2442'; ctx.fill();
  text('Shortcut Cannon', 32, cy + 18, 15, '#fff', 'left');
  text(`start your climb higher (start: ${save.startAlt} m)`, 32, cy + 38, 11, '#9aa6c8', 'left', false);
  CANNONS.forEach((c, i) => {
    const bx = 32 + i * 176, owned = save.cannon[c.g], unlocked = save.beaten[c.g], sel = save.startAlt === c.alt;
    const label = owned ? (sel ? `${c.alt} m  ON` : `${c.alt} m`) : (unlocked ? `${c.alt} m  ⚙${fmt(c.cost)}` : `${c.alt} m  locked`);
    btn(label, bx, cy + 46, 164, 26, () => {
      if (owned) { save.startAlt = sel ? 0 : c.alt; persist(); }
      else if (unlocked && save.scrap >= c.cost) { save.scrap -= c.cost; save.cannon[c.g] = true; save.startAlt = c.alt; persist(); }
    }, { disabled: !owned && (!unlocked || save.scrap < c.cost), color: sel ? '#e0753a' : '#3c6df0', size: 13 });
  });
  btn('CLIMB!', 20, H - 76, 210, 56, () => startRun(false), { color: '#e0753a', size: 26 });
  btn('DAILY', 240, H - 76, 140, 56, () => startRun(true), { color: '#7a4fe0', size: 18 });
  text(`Daily #${dayNumber()}: same map for everyone, no upgrades${save.daily && save.daily.date === todayStr() ? ' · best ' + fmt(save.daily.best) + ' m' : ''}`, W / 2, H - 10, 11, '#9aa6c8', 'center', false);
}

function render() {
  buttons = [];
  ctx.save();
  if (state === 'menu') { drawMenu(); ctx.restore(); return; }
  if (shake > 0) ctx.translate(rng(-shake, shake) / 2, rng(-shake, shake) / 2);
  drawWorld(); drawBird();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.l * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y - run.cam, 3, 3); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.l * 2); text(f.txt, f.x, f.y - run.cam, 15, f.c); }
  ctx.globalAlpha = 1;
  if (flash.a > 0) { ctx.globalAlpha = flash.a; ctx.fillStyle = flash.c; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (state !== 'dead' && state !== 'victory') drawHUD();
  if (state === 'pick') drawPick();
  if (state === 'dead' || state === 'victory') drawEnd();
  ctx.restore();
}

// ---------- Loop & input ----------
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  update(dt); render(); requestAnimationFrame(frame);
}
function pointer(e) {
  e.preventDefault(); ac();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { SFX.click(); b.onClick(); return; }
  flap(x < W / 2 ? -1 : 1);
}
cv.addEventListener('pointerdown', pointer);
addEventListener('keydown', e => {
  const k = e.code; ac();
  if (k === 'Space' || k === 'ArrowUp') { e.preventDefault(); if (state === 'dead' || state === 'victory') { if (performance.now() - deadAt > 500) startRun(dailyMode); } else if (state === 'menu') startRun(false); else flap(0); }
  else if (k === 'ArrowLeft' || k === 'KeyA') flap(-1);
  else if (k === 'ArrowRight' || k === 'KeyD') flap(1);
  else if (state === 'pick' && e.key >= '1' && e.key <= '9') choose(+e.key - 1);
  else if (e.key === 'Enter' && state === 'menu') startRun(false);
});

newRun();
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, get run() { return run; }, save, startRun, flap, choose, get cards() { return cards; }, SUMMIT, GUARDS, die };
</script>
</body>
</html>
