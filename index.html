function drawShip(x, y, F, charging, firing, hit) {           // the Void Cruiser: SpriteKiln atlas rows idle, charge, fire, hit (96 px cells)
  const tt = run.t; let row = 0, col = Math.floor(tt * 11) % 8;
  if (hit) { row = 3; col = Math.floor(tt * 14) % 4; }
  else if (firing) { row = 2; col = Math.min(3, Math.floor(Math.max(0, ...F.beams.filter(m => m.t > m.warn).map(m => (m.t - m.warn) / m.fire)) * 4)); }
  else if (charging) { row = 1; col = Math.min(7, Math.floor(Math.max(0, ...F.beams.map(m => m.t / m.warn)) * 8)); }
  const X = Math.round(x / 4) * 4, Y = Math.round(y / 4) * 4;
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(SHIP, col * 96, row * 96, 96, 96, X - 192, Y - 192, 384, 384); ctx.restore();
}
const RIVET = new Image(); let rivetOk = false;
RIVET.onload = () => {
  rivetOk = true;
  try {
    const c = document.createElement('canvas'); c.width = RIVET.width; c.height = RIVET.height; const x = c.getContext('2d'); x.drawImage(RIVET, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height).data, seen = new Set(palCols.map(q => (q[0] << 16) | (q[1] << 8) | q[2]));
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) seen.add((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
    palCols = [...seen].map(k => [k >> 16, (k >> 8) & 255, k & 255]); palCache.clear();
