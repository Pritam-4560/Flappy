<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flapocalypse</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:400/640;background:#141b2e;image-rendering:auto}
</style>
</head>
<body>
<canvas id="c" width="400" height="640"></canvas>
<script>
"use strict";
// ============================ FLAPOCALYPSE ============================
// FLAP -> SURVIVE -> COLLECT -> CHOOSE UPGRADES -> DIE -> UPGRADE -> RUN IT BACK
const W = 400, H = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- Save data ----------
const SAVE_KEY = 'flapocalypse.v1';
let save = { scrap: 0, best: 0, runs: 0, perm: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---------- Permanent upgrades (bought with scrap, survive death) ----------
const PERMS = [
  { id: 'shield', name: 'Scrap Armor',    desc: 'Start each run with +1 shield',   max: 3, cost: l => 40 + l * 60 },
  { id: 'scrap',  name: 'Magpie Beak',    desc: '+15% scrap per level',            max: 5, cost: l => 25 + l * 30 },
  { id: 'wings',  name: 'Light Wings',    desc: '-4% gravity per level',           max: 5, cost: l => 30 + l * 35 },
  { id: 'gap',    name: 'Wide Berth',     desc: '+4px pipe gap per level',         max: 5, cost: l => 35 + l * 40 },
  { id: 'chaos',  name: 'Chaos Magnet',   desc: 'Start runs with +15 chaos / lvl', max: 3, cost: l => 45 + l * 50 },
  { id: 'choice', name: 'Fourth Option',  desc: 'Upgrade picks offer 4 cards',     max: 1, cost: l => 150 },
];
const pl = id => save.perm[id] || 0;

// ---------- Temporary upgrades (chosen during a run) ----------
const TEMPS = [
  { id: 'feather', name: 'Featherweight', desc: 'Gravity -12%',                  stack: 3 },
  { id: 'wide',    name: 'Wide Gap',      desc: 'Pipe gaps +14px',               stack: 3 },
  { id: 'shield',  name: 'Bubble',        desc: '+1 shield (absorbs a hit)',     stack: 9 },
  { id: 'magnet',  name: 'Scrap Magnet',  desc: 'Pull scrap from afar',          stack: 3 },
  { id: 'slow',    name: 'Slow Time',     desc: 'World speed -8%',               stack: 3 },
  { id: 'surge',   name: 'Scrap Surge',   desc: '+50% scrap this run',           stack: 3 },
  { id: 'damp',    name: 'Chaos Dampener',desc: 'Chaos fills 30% slower',        stack: 2 },
  { id: 'amp',     name: 'Chaos Engine',  desc: 'Chaos fills 40% faster',        stack: 2 },
  { id: 'glide',   name: 'Glider',        desc: 'Fall speed capped lower',       stack: 2 },
];

// ---------- Tunables ----------
const PIPES_PER_PICK = 5;     // upgrade choice cadence
const PIPES_PER_BOSS = 15;    // boss cadence
const CHAOS_DURATION = 8;     // seconds
const BOSS_DURATION = 12;     // seconds

// ---------- State ----------
let state = 'menu';           // menu | play | pick | dead
let run, buttons = [], cards = [], best_beat = false;
let last = 0, shake = 0, parts = [], floaters = [];
const rng = (a, b) => a + Math.random() * (b - a);

function newRun() {
  run = {
    bird: { x: 100, y: H / 2, vy: 0, r: 12 },
    pipes: [], scraps: [], beams: [],
    t: 0, dist: 0, passed: 0, spawnX: 520, scrap: 0,
    temps: {}, shields: pl('shield'), invuln: 0,
    chaos: Math.min(95, pl('chaos') * 15), chaosT: 0,
    boss: null, bossesDone: 0, nextBossAt: PIPES_PER_BOSS,
    nextPickAt: PIPES_PER_PICK, started: false, pendingBossReward: false,
  };
  best_beat = false;
}
const tl = id => (run && run.temps[id]) || 0;

// ---------- Derived stats ----------
const chaosOn   = () => run.chaosT > 0;
const gravity   = () => 1350 * (1 - 0.04 * pl('wings')) * Math.pow(0.88, tl('feather'));
const maxFall   = () => 520 - 90 * tl('glide');
const worldSpd  = () => {
  let s = Math.min(270, 150 + run.passed * 3.2) * Math.pow(0.92, tl('slow'));
  if (chaosOn()) s *= 1.2;
  return s;
};
const gapSize   = () => Math.max(118, 178 - run.passed * 1.2) + 4 * pl('gap') + 14 * tl('wide');
const scrapMult = () => (1 + 0.15 * pl('scrap') + 0.5 * tl('surge')) * (chaosOn() ? 2 : 1);

// ---------- Actions ----------
function flap() {
  if (state === 'menu') return;
  if (state !== 'play') return;
  run.started = true;
  run.bird.vy = -420;
  for (let i = 0; i < 4; i++) parts.push({ x: run.bird.x - 8, y: run.bird.y + 6, vx: rng(-60, -10), vy: rng(10, 60), l: .35, c: '#e8eefc' });
}
function startRun() { newRun(); state = 'play'; }

function addChaos(n) {
  if (chaosOn()) return;
  n *= Math.pow(0.7, tl('damp')) * Math.pow(1.4, tl('amp'));
  run.chaos = Math.min(100, run.chaos + n);
  if (run.chaos >= 100) { run.chaosT = CHAOS_DURATION; run.chaos = 100; shake = 10; float('CHAOS!', W / 2, 200, '#ff4fd8'); }
}
function float(txt, x, y, c = '#fff') { floaters.push({ txt, x, y, c, l: 1 }); }
function addScrap(base, x, y) {
  const n = Math.max(1, Math.round(base * scrapMult()));
  run.scrap += n; float('+' + n, x, y, '#ffd24a');
}

function hurt() {
  if (run.invuln > 0) return;
  if (run.shields > 0) {
    run.shields--; run.invuln = 1.2; shake = 8;
    float('SHIELD!', run.bird.x, run.bird.y - 20, '#6fe3ff');
    // nudge into the gap so a pipe hit doesn't instantly chain
    run.bird.vy = -300;
    return;
  }
  die();
}
function die() {
  state = 'dead'; shake = 14;
  save.scrap += run.scrap; save.runs++;
  if (run.passed > save.best) { save.best = run.passed; best_beat = true; }
  persist();
  for (let i = 0; i < 30; i++) parts.push({ x: run.bird.x, y: run.bird.y, vx: rng(-200, 200), vy: rng(-250, 150), l: rng(.4, 1), c: ['#ffd24a', '#ff6a3d', '#fff'][i % 3] });
}

function offerPick(bossReward) {
  const n = pl('choice') ? 4 : 3;
  const pool = TEMPS.filter(t => tl(t.id) < t.stack);
  const picks = [];
  while (picks.length < n && pool.length) picks.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  if (!picks.length) return;
  cards = picks; state = 'pick'; run.pickTitle = bossReward ? 'BOSS DOWN - CLAIM A REWARD' : 'CHOOSE AN UPGRADE';
}
function choose(i) {
  const t = cards[i]; if (!t) return;
  run.temps[t.id] = tl(t.id) + 1;
  if (t.id === 'shield') run.shields++;
  state = 'play';
}

// ---------- Spawning ----------
function spawnPipe() {
  const gap = gapSize();
  const gy = rng(110 + gap / 2, H - 110 - gap / 2);
  run.pipes.push({ x: run.spawnX, w: 58, gy, gap, passed: false, ph: rng(0, 6.28), nearGiven: false });
  if (Math.random() < 0.75) run.scraps.push({ x: run.spawnX + 29, y: gy + rng(-gap / 4, gap / 4), r: 8, v: Math.random() < 0.1 ? 5 : 1 });
  run.spawnX += rng(205, 240);
}
function startBoss() {
  run.boss = { t: 0, next: 0.6, id: run.bossesDone };
  run.beams = [];
  float('BOSS: THE GREAT PIGEON', W / 2, 180, '#ff6a3d');
}
function bossBeam() {
  const n = 1 + Math.min(2, run.boss.id);
  const lanes = [];
  for (let i = 0; i < n; i++) lanes.push(rng(70, H - 70));
  // always leave an open lane
  for (const y of lanes) run.beams.push({ y, t: 0, warn: 0.95, fire: 0.35 });
}

// ---------- Update ----------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  for (const f of floaters) { f.y -= 30 * dt; f.l -= dt; }
  floaters = floaters.filter(f => f.l > 0);
  if (state !== 'play') return;

  const b = run.bird;
  run.t += dt;
  if (run.invuln > 0) run.invuln -= dt;
  if (run.chaosT > 0) { run.chaosT -= dt; if (run.chaosT <= 0) { run.chaos = 0; float('chaos over', W / 2, 200, '#aaa'); } }

  // physics (hover until first flap)
  if (run.started) {
    b.vy = Math.min(maxFall(), b.vy + gravity() * dt);
    b.y += b.vy * dt;
  } else b.y = H / 2 + Math.sin(run.t * 4) * 6;
  if (b.y > H - b.r) { b.y = H - b.r; hurt(); if (state === 'play') b.vy = -380; }
  if (b.y < b.r) { b.y = b.r; b.vy = 0; }

  if (!run.started) return;
  const spd = worldSpd();
  run.dist += spd * dt;

  // spawn pipes (not during boss / while boss pending)
  const bossPending = run.passed >= run.nextBossAt && !run.boss;
  for (const o of [...run.pipes, ...run.scraps]) o.x -= spd * dt;
  run.spawnX -= spd * dt;
  if (!run.boss && !bossPending) while (run.spawnX < W + 80) spawnPipe();

  // pipes
  for (const p of run.pipes) {
    const gy = p.gy + (chaosOn() ? Math.sin(run.t * 3 + p.ph) * 55 : 0);
    p.cy = gy;
    const inX = b.x + b.r > p.x && b.x - b.r < p.x + p.w;
    if (inX && (b.y - b.r < gy - p.gap / 2 || b.y + b.r > gy + p.gap / 2)) hurt();
    // near miss: passing while hugging the edge
    if (inX && !p.nearGiven) {
      const dTop = (b.y - b.r) - (gy - p.gap / 2), dBot = (gy + p.gap / 2) - (b.y + b.r);
      if (Math.min(dTop, dBot) < 9 && Math.min(dTop, dBot) >= 0) { p.nearGiven = true; addChaos(14); float('CLOSE!', b.x + 30, b.y - 20, '#ff4fd8'); }
    }
    if (!p.passed && p.x + p.w < b.x - b.r) {
      p.passed = true; run.passed++;
      if (run.passed > save.best && !best_beat) { /* counted on death */ }
      if (run.passed >= run.nextPickAt && run.passed < run.nextBossAt) { run.nextPickAt += PIPES_PER_PICK; offerPick(false); }
    }
  }
  run.pipes = run.pipes.filter(p => p.x + p.w > -20);

  // scrap
  for (const s of run.scraps) {
    if (tl('magnet')) {
      const dx = b.x - s.x, dy = b.y - s.y, d = Math.hypot(dx, dy), R = 70 + 50 * tl('magnet');
      if (d < R && d > 1) { s.x += dx / d * 260 * dt; s.y += dy / d * 260 * dt; }
    }
    if (!s.got && Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r + 2) {
      s.got = true; addScrap(s.v, s.x, s.y); addChaos(3);
      for (let i = 0; i < 5; i++) parts.push({ x: s.x, y: s.y, vx: rng(-80, 80), vy: rng(-100, 40), l: .4, c: '#ffd24a' });
    }
  }
  run.scraps = run.scraps.filter(s => !s.got && s.x > -20);

  // boss encounter
  if (bossPending && run.pipes.every(p => p.passed)) startBoss();
  if (run.boss) {
    const B = run.boss; B.t += dt; B.next -= dt;
    if (B.t < BOSS_DURATION - 1.5 && B.next <= 0) { bossBeam(); B.next = Math.max(0.55, 1.25 - B.id * 0.15); }
    for (const m of run.beams) {
      m.t += dt;
      if (m.t > m.warn && m.t < m.warn + m.fire && Math.abs(b.y - m.y) < b.r + 14) hurt();
    }
    run.beams = run.beams.filter(m => m.t < m.warn + m.fire);
    if (B.t >= BOSS_DURATION) {
      run.boss = null; run.bossesDone++; run.nextBossAt += PIPES_PER_BOSS;
      run.spawnX = W + 200; run.beams = [];
      const bonus = 25 + run.bossesDone * 10; addScrap(bonus / scrapMult(), W / 2, 250);
      addChaos(25);
      if (state === 'play') offerPick(true);
    }
  }
}

// ---------- Drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(t, x, y, size = 16, c = '#fff', align = 'center', bold = true) {
  ctx.font = `${bold ? '700 ' : ''}${size}px system-ui,Segoe UI,sans-serif`;
  ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y);
}
function btn(label, x, y, w, h, onClick, opts = {}) {
  buttons.push({ x, y, w, h, onClick });
  rr(x, y, w, h, 10); ctx.fillStyle = opts.disabled ? '#2a3350' : (opts.color || '#3c6df0'); ctx.fill();
  text(label, x + w / 2, y + h / 2, opts.size || 18, opts.disabled ? '#7b86a8' : '#fff');
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const c = run && chaosOn();
  g.addColorStop(0, c ? '#3a0f4a' : '#16213d'); g.addColorStop(1, c ? '#1a0a2a' : '#0d1424');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const off = run ? run.dist : performance.now() / 30;
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  for (let i = 0; i < 30; i++) {
    const x = ((i * 97 - off * (0.15 + (i % 3) * .05)) % (W + 20) + (W + 20)) % (W + 20) - 10;
    ctx.fillRect(x, (i * 53) % H, 2, 2);
  }
}
function drawBird() {
  const b = run.bird;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.max(-.5, Math.min(1, b.vy / 600)));
  if (run.invuln > 0 && ((run.t * 20) | 0) % 2) ctx.globalAlpha = .4;
  ctx.fillStyle = chaosOn() ? '#ff4fd8' : '#ffd24a';
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -4, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6, -4, 2, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff6a3d'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(19, 3); ctx.lineTo(10, 6); ctx.fill();
  const wy = Math.sin(run.t * 25) * 4; ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(-3, 4 + wy, 7, 4, 0, 0, 7); ctx.fill();
  if (run.shields > 0) { ctx.globalAlpha = 1; ctx.strokeStyle = '#6fe3ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, b.r + 5, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function drawPipes() {
  for (const p of run.pipes) {
    const gy = p.cy ?? p.gy, top = gy - p.gap / 2, bot = gy + p.gap / 2;
    ctx.fillStyle = chaosOn() ? '#a63cc4' : '#3fae6a';
    ctx.fillRect(p.x, 0, p.w, top); ctx.fillRect(p.x, bot, p.w, H - bot);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(p.x, 0, 6, top); ctx.fillRect(p.x, bot, 6, H - bot);
    ctx.fillStyle = chaosOn() ? '#c85be6' : '#58cf86';
    ctx.fillRect(p.x - 4, top - 18, p.w + 8, 18); ctx.fillRect(p.x - 4, bot, p.w + 8, 18);
  }
  for (const s of run.scraps) {
    ctx.fillStyle = s.v > 1 ? '#6fe3ff' : '#ffd24a';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * .45, 0, 7); ctx.fill();
  }
}
function drawBoss() {
  const B = run.boss; if (!B) return;
  for (const m of run.beams) {
    const firing = m.t > m.warn;
    if (!firing) { ctx.fillStyle = `rgba(255,80,60,${.12 + .12 * Math.sin(m.t * 30)})`; ctx.fillRect(0, m.y - 14, W, 28); }
    else { ctx.fillStyle = '#ff6a3d'; ctx.fillRect(0, m.y - 14, W, 28); ctx.fillStyle = '#fff'; ctx.fillRect(0, m.y - 4, W, 8); }
  }
  // boss body on right
  const by = H / 2 + Math.sin(B.t * 2) * 160;
  ctx.fillStyle = '#7a7fa0'; ctx.beginPath(); ctx.ellipse(W - 28, by, 44, 56, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(W - 48, by - 12, 7, 0, 7); ctx.fill();
  // timer bar
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(60, 58, W - 120, 10, 5); ctx.fill();
  ctx.fillStyle = '#ff6a3d'; rr(60, 58, (W - 120) * (1 - B.t / BOSS_DURATION), 10, 5); ctx.fill();
  text('THE GREAT PIGEON - SURVIVE', W / 2, 44, 12, '#ffb199');
}
function drawHUD() {
  text(String(run.passed), W / 2, 90, 52, 'rgba(255,255,255,.9)');
  text('⚙ ' + run.scrap, 14, 24, 18, '#ffd24a', 'left');
  text('best ' + save.best, W - 14, 24, 14, '#9aa6c8', 'right');
  // chaos meter
  const mw = 150, mx = W / 2 - mw / 2;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(mx, H - 26, mw, 12, 6); ctx.fill();
  const frac = chaosOn() ? run.chaosT / CHAOS_DURATION : run.chaos / 100;
  ctx.fillStyle = chaosOn() ? '#ff4fd8' : '#a06bff'; rr(mx, H - 26, Math.max(0, mw * frac), 12, 6); ctx.fill();
  text(chaosOn() ? 'CHAOS x2 SCRAP' : 'CHAOS', W / 2, H - 38, 11, '#d9c9ff');
  if (run.shields) text('🛡 ' + run.shields, 14, 48, 15, '#6fe3ff', 'left');
  if (!run.started) {
    text('TAP / SPACE TO FLAP', W / 2, H / 2 + 70, 18, '#fff');
    text('Fly through gaps · grab scrap · near-misses feed CHAOS', W / 2, H / 2 + 98, 12, '#9aa6c8', 'center', false);
  }
}
function drawPick() {
  ctx.fillStyle = 'rgba(5,8,16,.82)'; ctx.fillRect(0, 0, W, H);
  text(run.pickTitle, W / 2, 70, 20, '#fff');
  text('click a card or press 1-' + cards.length, W / 2, 96, 12, '#9aa6c8', 'center', false);
  const n = cards.length, ch = n === 4 ? 100 : 124, gapY = 12, y0 = 124;
  cards.forEach((c, i) => {
    const y = y0 + i * (ch + gapY);
    buttons.push({ x: 30, y, w: W - 60, h: ch, onClick: () => choose(i) });
    rr(30, y, W - 60, ch, 12); ctx.fillStyle = '#1f2a4a'; ctx.fill();
    ctx.strokeStyle = '#4b63b3'; ctx.lineWidth = 2; ctx.stroke();
    text(`${i + 1}. ${c.name}`, W / 2, y + ch * .35, 20, '#fff');
    text(c.desc, W / 2, y + ch * .62, 14, '#b8c4ea', 'center', false);
    if (tl(c.id)) text(`owned x${tl(c.id)}`, W / 2, y + ch * .84, 11, '#6fe3ff', 'center', false);
  });
}
function drawDead() {
  ctx.fillStyle = 'rgba(5,8,16,.72)'; ctx.fillRect(0, 0, W, H);
  text('YOU DIED', W / 2, 120, 38, '#ff6a3d');
  text(`Pipes: ${run.passed}${best_beat ? '   NEW BEST!' : ''}`, W / 2, 175, 22, '#fff');
  text(`Scrap banked: +${run.scrap}`, W / 2, 210, 20, '#ffd24a');
  text(`Total scrap: ${save.scrap}`, W / 2, 240, 16, '#ffd24a', 'center', false);
  btn('UPGRADES / RUN IT BACK', 60, 300, W - 120, 56, () => { state = 'menu'; });
}
function drawMenu() {
  drawBackground();
  text('FLAPOCALYPSE', W / 2, 44, 30, '#ffd24a');
  text(`⚙ ${save.scrap} scrap   ·   best ${save.best}   ·   runs ${save.runs}`, W / 2, 78, 13, '#b8c4ea', 'center', false);
  const rowH = 70, y0 = 100;
  PERMS.forEach((p, i) => {
    const y = y0 + i * (rowH + 6), lvl = pl(p.id), maxed = lvl >= p.max, cost = p.cost(lvl);
    rr(20, y, W - 40, rowH, 10); ctx.fillStyle = '#1b2442'; ctx.fill();
    text(`${p.name}  (${lvl}/${p.max})`, 32, y + 22, 15, '#fff', 'left');
    text(p.desc, 32, y + 46, 12, '#9aa6c8', 'left', false);
    const can = !maxed && save.scrap >= cost;
    btn(maxed ? 'MAX' : `⚙ ${cost}`, W - 120, y + 14, 90, 42, () => {
      if (can) { save.scrap -= cost; save.perm[p.id] = lvl + 1; persist(); }
    }, { disabled: !can, color: '#2f9e5e', size: 15 });
  });
  btn('FLAP!', 60, H - 84, W - 120, 56, startRun, { color: '#e0753a', size: 26 });
}
function render() {
  buttons = [];
  ctx.save();
  if (state === 'menu') { drawMenu(); ctx.restore(); return; }
  if (shake > 0) ctx.translate(rng(-shake, shake) / 2, rng(-shake, shake) / 2);
  drawBackground();
  drawPipes(); drawBoss(); drawBird();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.l * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 3, 3); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.l * 2); text(f.txt, f.x, f.y, 16, f.c); }
  ctx.globalAlpha = 1;
  drawHUD();
  if (state === 'pick') drawPick();
  if (state === 'dead') drawDead();
  ctx.restore();
}

// ---------- Loop ----------
function frame(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}

// ---------- Input ----------
function pointer(e) {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.onClick(); return; }
  flap();
}
cv.addEventListener('pointerdown', pointer);
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (state === 'dead') state = 'menu'; else if (state === 'menu') startRun(); else flap(); }
  else if (state === 'pick' && e.key >= '1' && e.key <= '9') choose(+e.key - 1);
  else if (e.key === 'Enter' && state === 'menu') startRun();
});

newRun();
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, get run() { return run; }, save, startRun, flap, choose, get cards() { return cards; } }; // test hook
</script>
